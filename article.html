<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TechTek101</title>

  <style>
    :root {
      --bg: #08090d;
      --surface: #101218;
      --surface-2: #151821;
      --text: #f5f7fb;
      --muted: #9ca3b4;
      --border: rgba(255,255,255,0.08);
      --accent: #7c5cff;
      --max-width: 1100px;
      --shadow: 0 25px 80px rgba(0,0,0,0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,9,13,0.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      max-width: var(--max-width);
      margin: auto;
      min-height: 72px;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.8px;
      white-space: nowrap;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 14px;
      transition: 0.2s;
    }

    .nav-links a:hover {
      color: white;
    }

    /* =========================
       ARTICLE
    ========================= */

    .article-page {
      max-width: var(--max-width);
      margin: auto;
      padding: 70px 24px 100px;
    }

    .article-header {
      max-width: 900px;
      margin: 0 auto 45px;
      text-align: center;
    }

    .category-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 7px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;

      background: rgba(255,255,255,0.04);
      color: #c9c4ff;

      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .category-label svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      stroke: currentColor;
    }

    .article-title {
      margin-top: 24px;

      font-size: clamp(38px, 6vw, 72px);
      line-height: 1.05;
      letter-spacing: -3px;
      font-weight: 850;
    }

    .article-subtitle {
      max-width: 760px;
      margin: 24px auto 0;

      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .article-meta {
      margin-top: 25px;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;

      color: #858b9c;
      font-size: 13px;
    }

    .dot {
      opacity: 0.5;
    }

    /* =========================
       HERO IMAGE / VISUAL
    ========================= */

    .article-hero {
      width: 100%;
      min-height: 430px;

      margin: 50px 0 65px;

      border-radius: 26px;
      overflow: hidden;

      position: relative;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(124,92,255,0.28),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(0,200,255,0.18),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #11131b,
          #0c0e14
        );

      border: 1px solid var(--border);
      box-shadow: var(--shadow);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .article-hero img {
      width: 100%;
      height: 100%;
      min-height: 430px;
      display: block;

      object-fit: cover;
    }

    .article-hero-placeholder {
      width: 100%;
      min-height: 430px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 50px;
    }

    .article-hero-placeholder svg {
      width: 130px;
      height: 130px;

      fill: currentColor;
      stroke: currentColor;

      opacity: 0.9;
    }

    /* =========================
       ARTICLE CONTENT
    ========================= */

    .article-content {
      max-width: 780px;
      margin: auto;

      font-size: 18px;
      color: #d9dce5;
    }

    .article-content p {
      margin-bottom: 25px;
    }

    .article-content h2 {
      margin: 55px 0 20px;

      color: white;

      font-size: 30px;
      line-height: 1.2;
      letter-spacing: -0.8px;
    }

    .article-content h3 {
      margin: 40px 0 15px;

      color: white;

      font-size: 23px;
      line-height: 1.3;
    }

    .article-content ul,
    .article-content ol {
      margin: 0 0 30px 25px;
    }

    .article-content li {
      margin-bottom: 10px;
    }

    .article-content blockquote {
      margin: 40px 0;
      padding: 25px 30px;

      border-left: 3px solid var(--accent);

      background: var(--surface);

      border-radius: 0 14px 14px 0;

      color: #e8e9ef;
      font-size: 20px;
      font-style: italic;
    }

    .article-content img {
      width: 100%;
      height: auto;

      margin: 30px 0;

      display: block;

      border-radius: 18px;
      border: 1px solid var(--border);
    }

    .article-content a {
      color: #a995ff;
      text-decoration: underline;
    }

    /* =========================
       CONCLUSION
    ========================= */

    .article-conclusion {
      max-width: 780px;
      margin: 65px auto 0;
      padding: 30px;

      background: var(--surface);
      border: 1px solid var(--border);

      border-radius: 18px;
    }

    .article-conclusion h2 {
      margin-bottom: 15px;

      font-size: 24px;
      line-height: 1.2;
    }

    .article-conclusion p {
      color: var(--muted);
      font-size: 17px;
    }

    /* =========================
       BACK BUTTON
    ========================= */

    .article-navigation {
      max-width: 780px;
      margin: 60px auto 0;

      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 12px 17px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: var(--surface);

      color: #d9dce5;
      font-size: 14px;
      font-weight: 700;

      transition: 0.2s;
    }

    .back-button:hover {
      background: var(--surface-2);
      border-color: rgba(255,255,255,0.16);
      transform: translateY(-2px);
    }

    /* =========================
       404
    ========================= */

    .not-found {
      min-height: 65vh;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .not-found h1 {
      font-size: 70px;
      margin-bottom: 10px;
    }

    .not-found p {
      color: var(--muted);
      margin-bottom: 25px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid var(--border);

      padding: 35px 24px;

      color: #777d8d;
      text-align: center;

      font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .nav {
        min-height: 65px;
        padding: 0 17px;
      }

      .nav-links {
        display: none;
      }

      .article-page {
        padding: 45px 17px 70px;
      }

      .article-title {
        font-size: 40px;
        letter-spacing: -1.8px;
      }

      .article-subtitle {
        font-size: 16px;
      }

      .article-hero,
      .article-hero-placeholder {
        min-height: 260px;
      }

      .article-hero img {
        min-height: 260px;
      }

      .article-content {
        font-size: 17px;
      }

      .article-content h2 {
        font-size: 27px;
      }

      .article-content blockquote {
        padding: 20px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <nav class="nav">

    <a href="index.html" class="logo">
      Tech<span>Tek</span>101
    </a>

    <div class="nav-links">
      <a href="category.html?cat=ai">AI</a>
      <a href="category.html?cat=apple">Apple</a>
      <a href="category.html?cat=android">Android</a>
      <a href="category.html?cat=pc">PC</a>
      <a href="category.html?cat=audio">Audio</a>
      <a href="category.html?cat=gadgets">Gadgets</a>
    </div>

  </nav>
</header>


<main id="app"></main>


<footer>
  © 2026 TechTek101 — Technology, Explained.
</footer>


<script src="articles.js"></script>

<script>

  /* =========================
     GET ARTICLE ID
  ========================= */

  const params = new URLSearchParams(window.location.search);

  const articleId = params.get("id");

  const article = articles[articleId];


  /* =========================
     ICON FALLBACK
  ========================= */

  const defaultIcon = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="8"></circle>
      <path d="M8 12h8"></path>
      <path d="M12 8v8"></path>
    </svg>
  `;


  /* =========================
     ARTICLE NOT FOUND
  ========================= */

  if (!article) {

    document.title = "Article Not Found — TechTek101";

    document.getElementById("app").innerHTML = `
      <section class="not-found">

        <div>

          <h1>404</h1>

          <p>
            Sorry, this article could not be found.
          </p>

          <a href="index.html" class="back-button">
            ← Back to Home
          </a>

        </div>

      </section>
    `;

  }

  /* =========================
     ARTICLE FOUND
  ========================= */

  else {

    document.title = `${article.title} — TechTek101`;


    const icon = article.icon || defaultIcon;


    /* HERO */

    let heroHTML = "";

    if (article.image) {

      heroHTML = `
        <img
          src="${article.image}"
          alt="${article.title}"
        >
      `;

    } else {

      heroHTML = `
        <div class="article-hero-placeholder">
          ${icon}
        </div>
      `;

    }


    /* CONTENT */

    document.getElementById("app").innerHTML = `

      <article class="article-page">


        <!-- ARTICLE HEADER -->

        <header class="article-header">

          <div class="category-label">
            ${icon}
            ${article.category}
          </div>


          <h1 class="article-title">
            ${article.title}
          </h1>


          ${
            article.subtitle
            ?
            `<p class="article-subtitle">
              ${article.subtitle}
            </p>`
            :
            ""
          }


          <div class="article-meta">

            <span>
              ${article.date || ""}
            </span>

            ${
              article.read
              ?
              `
                <span class="dot">•</span>

                <span>
                  ${article.read}
                </span>
              `
              :
              ""
            }

          </div>

        </header>


        <!-- HERO -->

        <div class="article-hero">
          ${heroHTML}
        </div>


        <!-- ARTICLE BODY -->

        <div class="article-content">

          ${article.content || ""}

        </div>


        <!-- CONCLUSION -->

        ${
          article.conclusion
          ?
          `
            <section class="article-conclusion">

              <h2>
                Conclusion
              </h2>

              <p>
                ${article.conclusion}
              </p>

            </section>
          `
          :
          ""
        }


        <!-- NAVIGATION -->

        <div class="article-navigation">

          <a
            href="category.html?cat=${article.categoryKey}"
            class="back-button"
          >
            ← Back to ${article.category}
          </a>


          <a
            href="index.html"
            class="back-button"
          >
            Home →
          </a>

        </div>


      </article>

    `;

  }

</script>

</body>
</html>
