<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Category — TechTek101</title>

  <meta
    name="description"
    content="Explore technology stories from TechTek101."
  >

  <style>

    :root {
      --bg: #07090d;
      --bg-soft: #0d1016;
      --card: #11151d;
      --card-hover: #161b25;

      --text: #f5f7fb;
      --muted: #8e97a8;

      --border: rgba(255,255,255,.08);

      --accent: #6c63ff;
      --accent-2: #00d4ff;

      --max-width: 1240px;
      --radius: 20px;

      --shadow:
        0 20px 60px rgba(0,0,0,.35);
    }


    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 80% 0%,
          rgba(108,99,255,.13),
          transparent 30%
        ),
        radial-gradient(
          circle at 10% 20%,
          rgba(0,212,255,.06),
          transparent 25%
        ),
        var(--bg);

      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    .container {
      width: min(92%, var(--max-width));
      margin: auto;
    }


    /* =========================
       HEADER
       ========================= */

    header {
      position: relative;
      top: 0;
      left: 0;
      width: 100%;

      z-index: 1000;

      backdrop-filter: blur(18px);

      background:
        rgba(7,9,13,.82);

      border-bottom:
        1px solid rgba(255,255,255,.05);
    }


    .navbar {
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }


    .logo {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 23px;
      font-weight: 800;

      letter-spacing: -.8px;
    }


    .logo-mark {
      width: 35px;
      height: 35px;

      border-radius: 10px;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-2)
        );

      color: white;

      font-size: 16px;
      font-weight: 900;

      box-shadow:
        0 0 25px rgba(108,99,255,.35);
    }


    .logo em {
      color: var(--accent-2);
      font-style: normal;
    }


    .nav-links {
      display: flex;
      gap: 30px;

      list-style: none;

      color: #aeb6c5;

      font-size: 14px;
      font-weight: 600;
    }


    .nav-links a:hover {
      color: white;
    }


    /* =========================
       PAGE
       ========================= */

    main {
      padding-top: 76px;
    }


    .category-hero {
      padding:
        100px 0 70px;

      position: relative;
      overflow: hidden;
    }


    .category-hero::before {
      content: "";

      position: absolute;

      width: 450px;
      height: 450px;

      right: -150px;
      top: 20px;

      border-radius: 50%;

      background:
        rgba(108,99,255,.12);

      filter: blur(120px);
    }


    .category-content {
      position: relative;
      z-index: 2;
    }


    .back {
      display: inline-block;

      color: #a8a3ff;

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 30px;
    }


    /* =========================
       CATEGORY ICON
       ========================= */

    .category-icon {
      width: 65px;
      height: 65px;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      margin-bottom: 20px;

      color: white;
    }


    .category-icon svg {
      width: 58px;
      height: 58px;

      display: block;

      fill: currentColor;
      stroke: currentColor;
    }


    .category-hero h1 {
      font-size:
        clamp(45px, 7vw, 78px);

      line-height: .95;

      letter-spacing: -4px;

      margin-bottom: 22px;
    }


    .category-hero p {
      max-width: 680px;

      color: var(--muted);

      font-size: 18px;
    }


    /* =========================
       ARTICLES
       ========================= */

    .articles-section {
      padding:
        20px 0 100px;
    }


    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;

      margin-bottom: 30px;
    }


    .section-heading h2 {
      font-size: 30px;

      letter-spacing: -1px;
    }


    .section-heading span {
      color: var(--muted);

      font-size: 13px;
    }


    .articles-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 20px;
    }


    .article-card {
      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius: 18px;

      overflow: hidden;

      transition: .3s;
    }


    .article-card:hover {
      transform:
        translateY(-6px);

      background:
        var(--card-hover);

      border-color:
        rgba(108,99,255,.35);

      box-shadow:
        var(--shadow);
    }


    .article-image {
      height: 210px;

      display: grid;

      place-items: center;

      background:
        radial-gradient(
          circle at 30% 20%,
          rgba(108,99,255,.4),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #181d2b,
          #0d1118
        );

      color: white;
    }


    .article-image svg {
      width: 65px;
      height: 65px;

      fill: currentColor;
      stroke: currentColor;
    }


    .article-body {
      padding: 22px;
    }


    .tag {
      display: inline-block;

      padding: 5px 10px;

      border-radius: 7px;

      background:
        rgba(108,99,255,.18);

      color: #bbb7ff;

      font-size: 10px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: .5px;

      margin-bottom: 12px;
    }


    .article-body h3 {
      font-size: 19px;

      line-height: 1.3;

      letter-spacing: -.4px;

      margin-bottom: 10px;
    }


    .article-body p {
      color: var(--muted);

      font-size: 13px;

      line-height: 1.6;

      margin-bottom: 18px;
    }


    .meta {
      display: flex;

      gap: 10px;

      color: #747d8d;

      font-size: 11px;
    }


    /* =========================
       FOOTER
       ========================= */

    footer {
      border-top:
        1px solid var(--border);

      padding:
        45px 0 30px;

      background:
        #05070a;
    }


    .footer-inner {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;
    }


    .footer-inner p {
      color: #656d7b;

      font-size: 12px;
    }


    .footer-links {
      display: flex;

      gap: 20px;
    }


    .footer-links a {
      color: var(--muted);

      font-size: 12px;
    }


    .footer-links a:hover {
      color: white;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 900px) {

      .nav-links {
        gap: 15px;
      }

      .articles-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 600px) {

      .navbar {
        height: 68px;
      }

      .nav-links {
        display: none;
      }

      main {
        padding-top: 68px;
      }

      .category-hero {
        padding:
          75px 0 55px;
      }

      .category-hero h1 {
        font-size: 50px;

        letter-spacing: -3px;
      }

      .category-hero p {
        font-size: 16px;
      }

      .articles-grid {
        grid-template-columns: 1fr;
      }

      .section-heading {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
      }

      .footer-inner {
        flex-direction: column;

        align-items: flex-start;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
       ========================= -->

  <header>

    <div class="container navbar">

      <a href="index.html" class="logo">

        <div class="logo-mark">
          T
        </div>

        <span>
          Tech<em>Tek101</em>
        </span>

      </a>


      <nav>

        <ul class="nav-links">

          <li>
            <a href="index.html#latest">
              Latest
            </a>
          </li>

          <li>
            <a href="index.html#categories">
              Categories
            </a>
          </li>

          <li>
            <a href="index.html#trending">
              Trending
            </a>
          </li>

          <li>
            <a href="about.html">
              About
            </a>
          </li>

        </ul>

      </nav>

    </div>

  </header>


  <!-- =========================
       MAIN
       ========================= -->

  <main>

    <section class="category-hero">

      <div class="container category-content">

        <a
          href="index.html"
          class="back"
        >
          ← Back to TechTek101
        </a>


        <div
          class="category-icon"
          id="categoryIcon"
        ></div>


        <h1 id="categoryTitle">
          Artificial Intelligence
        </h1>


        <p id="categoryDescription">
          Explore the latest ideas, breakthroughs and stories
          shaping the world of artificial intelligence.
        </p>

      </div>

    </section>


    <section class="articles-section">

      <div class="container">

        <div class="section-heading">

          <div>
            <h2>
              Latest stories
            </h2>
          </div>

          <span id="articleCount">
            0 stories
          </span>

        </div>


        <div
          class="articles-grid"
          id="articlesGrid"
        ></div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
       ========================= -->

  <footer>

    <div class="container footer-inner">

      <p>
        © 2026 TechTek101. All rights reserved.
      </p>


      <div class="footer-links">

        <a href="index.html">
          Home
        </a>

        <a href="about.html">
          About
        </a>

        <a href="index.html#categories">
          Categories
        </a>

      </div>

    </div>

  </footer>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    /* =========================
       SVG ICONS
       ========================= */

    const icons = {

      ai: `
        <svg viewBox="0 0 24 24" aria-label="AI">
          <path
            d="M12 2a3 3 0 0 0-3 3v1H7a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h2v2a1 1 0 0 0 2 0v-2h2v2a1 1 0 0 0 2 0v-2h2a3 3 0 0 0 3-3V9a3 3 0 0 0-3-3h-2V5a3 3 0 0 0-3-3Zm-1 4V5a1 1 0 0 1 2 0v1h-2Zm-4 3a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V9Zm2 1v2h2v-2H9Zm4 0v2h2v-2h-2Z"
          />
        </svg>
      `,


      apple: `
        <svg viewBox="0 0 24 24" aria-label="Apple">
          <path
            d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.95-2.53 4.08zM12.03 7.25C11.88 5.02 13.69 3.18 15.84 3c.3 2.58-2.32 4.5-3.81 4.25z"
          />
        </svg>
      `,


      android: `
        <svg viewBox="0 0 24 24" aria-label="Android">
          <path
            d="M17.87 6.47l1.51-2.62a.32.32 0 0 0-.55-.32l-1.53 2.66A10.08 10.08 0 0 0 12 4.9c-1.9 0-3.76.45-5.3 1.29L5.16 3.53a.32.32 0 0 0-.55.32l1.52 2.62C3.59 8 1.86 10.78 1.86 14h20.28c0-3.22-1.73-6-4.27-7.53ZM7 10a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm12 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM4.5 15v5.27c0 .55.45 1 1 1h1.32v1.82a.91.91 0 1 0 1.82 0v-1.82h6.72v1.82a.91.91 0 1 0 1.82 0v-1.82h1.32c.55 0 1-.45 1-1V15h-15Z"
          />
        </svg>
      `,


      pc: `
        <svg viewBox="0 0 24 24" aria-label="PC">
          <path
            d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6v2h2a1 1 0 0 1 0 2H8a1 1 0 0 1 0-2h2v-2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 2v10h16V6H4Z"
          />
        </svg>
      `,


      audio: `
        <svg viewBox="0 0 24 24" aria-label="Audio">
          <path
            d="M12 3a7 7 0 0 0-7 7v5a2 2 0 0 0 2 2h2v-6H7v-1a5 5 0 0 1 10 0v1h-2v6h2a2 2 0 0 0 2-2v-5a7 7 0 0 0-7-7Zm-4 9h1v4H8v-4Zm8 0h1v4h-1v-4Z"
          />
        </svg>
      `,


      gadgets: `
        <svg viewBox="0 0 24 24" aria-label="Gadgets">
          <path
            d="M13 2 4 13h6l-1 9 9-11h-6l1-9Zm-1.1 6.2-.35 2.8H14l-2.9 3.55.35-2.8H8.1l3.8-3.55Z"
          />
        </svg>
      `

    };


    /* =========================
       CATEGORIES
       ========================= */

    const categories = {

      ai: {

        title:
          "Artificial Intelligence",

        icon:
          icons.ai,

        description:
          "Explore the latest ideas, breakthroughs and stories shaping the world of artificial intelligence."

      },


      apple: {

        title:
          "Apple",

        icon:
          icons.apple,

        description:
          "Everything Apple — from iPhone and Mac to software, chips and the future of the ecosystem."

      },


      android: {

        title:
          "Android",

        icon:
          icons.android,

        description:
          "The latest Android phones, software, features and technologies shaping the mobile world."

      },


      pc: {

        title:
          "PC & Laptop",

        icon:
          icons.pc,

        description:
          "Laptops, desktops, processors, displays and everything happening in modern computing."

      },


      audio: {

        title:
          "Audio",

        icon:
          icons.audio,

        description:
          "Headphones, earbuds, speakers, codecs and the technology behind great sound."

      },


      gadgets: {

        title:
          "Gadgets",

        icon:
          icons.gadgets,

        description:
          "Smart gadgets and everyday technology designed to make life easier, smarter and more enjoyable."

      }

    };


    /* =========================
       ARTICLES
       ========================= */

    const articles = [

      {
        id: "ai-assistants",
        category: "ai",
        icon: icons.ai,
        title:
          "Why AI assistants are becoming part of everyday life",
        excerpt:
          "From work to entertainment, intelligent assistants are changing how we interact with technology.",
        read:
          "6 min read",
        date:
          "Today"
      },


      {
        id: "ai-work",
        category: "ai",
        icon: icons.ai,
        title:
          "AI is changing the way we work. Here's what comes next.",
        excerpt:
          "The workplace is entering a new era as AI tools become more capable and accessible.",
        read:
          "8 min read",
        date:
          "Today"
      },


      {
        id: "apple-next",
        category: "apple",
        icon: icons.apple,
        title:
          "The next generation of Apple devices",
        excerpt:
          "A look at where Apple hardware and software could be heading next.",
        read:
          "5 min read",
        date:
          "Today"
      },


      {
        id: "android-era",
        category: "android",
        icon: icons.android,
        title:
          "The smartphone market is entering a new era",
        excerpt:
          "Bigger isn't always better. Here's where mobile design could be heading next.",
        read:
          "5 min read",
        date:
          "Today"
      },


      {
        id: "laptop-performance",
        category: "pc",
        icon: icons.pc,
        title:
          "Do you really need a powerful laptop anymore?",
        excerpt:
          "Modern chips are becoming incredibly efficient. But where does raw performance still matter?",
        read:
          "7 min read",
        date:
          "Yesterday"
      },


      {
        id: "oled-miniled",
        category: "pc",
        icon: icons.pc,
        title:
          "OLED vs Mini-LED: which display technology wins?",
        excerpt:
          "We break down contrast, brightness, motion and everyday usability.",
        read:
          "9 min read",
        date:
          "2 days ago"
      },


      {
        id: "premium-headphones",
        category: "audio",
        icon: icons.audio,
        title:
          "Why premium headphones sound so different",
        excerpt:
          "A look at drivers, tuning, codecs and the technology behind modern wireless audio.",
        read:
          "8 min read",
        date:
          "Yesterday"
      },


      {
        id: "great-gadget",
        category: "gadgets",
        icon: icons.gadgets,
        title:
          "What makes a great everyday gadget?",
        excerpt:
          "The best gadgets don't just add features. They make everyday life genuinely easier.",
        read:
          "4 min read",
        date:
          "Yesterday"
      }

    ];


    /* =========================
       GET CATEGORY
       ========================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const requestedCategory =
      params.get("cat") || "ai";


    const categoryKey =
      categories[requestedCategory]
        ? requestedCategory
        : "ai";


    const category =
      categories[categoryKey];


    /* =========================
       UPDATE PAGE
       ========================= */

    document.title =
      category.title +
      " — TechTek101";


    document.getElementById(
      "categoryIcon"
    ).innerHTML =
      category.icon;


    document.getElementById(
      "categoryTitle"
    ).textContent =
      category.title;


    document.getElementById(
      "categoryDescription"
    ).textContent =
      category.description;


    /* =========================
       RENDER ARTICLES
       ========================= */

    const grid =
      document.getElementById(
        "articlesGrid"
      );


    const filteredArticles =
      articles.filter(
        article =>
          article.category ===
          categoryKey
      );


    document.getElementById(
      "articleCount"
    ).textContent =
      filteredArticles.length +
      " stories";


    filteredArticles.forEach(
      article => {

        const card =
          document.createElement(
            "a"
          );


        card.href =
          "article.html?id=" +
          article.id;


        card.className =
          "article-card";


        card.innerHTML = `

          <div class="article-image">
            ${article.icon}
          </div>

          <div class="article-body">

            <span class="tag">
              ${category.title}
            </span>

            <h3>
              ${article.title}
            </h3>

            <p>
              ${article.excerpt}
            </p>

            <div class="meta">

              <span>
                ${article.read}
              </span>

              <span>
                •
              </span>

              <span>
                ${article.date}
              </span>

            </div>

          </div>

        `;


        grid.appendChild(card);

      });

  </script>

</body>
</html>
